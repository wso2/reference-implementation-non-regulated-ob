components:
  securitySchemes:
    ClientOAuth2Security:
      type: oauth2
      description: >-
        Client credentials authorisation flow between the client application and
        the bank
      flows:
        clientCredentials:
          tokenUrl: https://authserver.example/token
          scopes: {}
    CustomerOAuth2Security:
      type: oauth2
      description: >-
        OAuth flow, it is required when the customer needs to perform SCA with
        the bank before a client application can access a bank resource owned by
        the customer
      flows:
        authorizationCode:
          authorizationUrl: https://authserver.example/authorization
          tokenUrl: https://authserver.example/token
          scopes: {}
  parameters:
    DomesticPaymentId:
      name: DomesticPaymentId
      in: path
      description: DomesticPaymentId
      required: true
      schema:
        type: string
    DomesticScheduledPaymentId:
      name: DomesticScheduledPaymentId
      in: path
      description: DomesticScheduledPaymentId
      required: true
      schema:
        type: string
    DomesticStandingOrderId:
      name: DomesticStandingOrderId
      in: path
      description: DomesticStandingOrderId
      required: true
      schema:
        type: string
    InternationalPaymentId:
      name: InternationalPaymentId
      in: path
      description: InternationalPaymentId
      required: true
      schema:
        type: string
    Authorization:
      in: header
      name: Authorization
      required: true
      description: An Authorisation Token as per https://tools.ietf.org/html/rfc6750
      schema:
        type: string
    x-customer-user-agent:
      in: header
      name: x-customer-user-agent
      description: Indicates the user-agent that the customer is using.
      required: false
      schema:
        type: string
    x-fapi-customer-ip-address:
      in: header
      name: x-fapi-customer-ip-address
      required: false
      description: The customer's IP address if the customer is currently logged in with the client application.
      schema:
        type: string
    x-fapi-auth-date:
      in: header
      name: x-fapi-auth-date
      required: false
      description: >-
        The time when the customer last logged in with the client application. 

        All dates in the HTTP headers are represented as RFC 7231 Full Dates. An
        example is below: 

        Sun, 10 Sep 2017 19:43:31 UTC
      schema:
        type: string
        pattern: '^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4} \d{2}:\d{2}:\d{2} (GMT|UTC)$'
    x-fapi-interaction-id:
      in: header
      name: x-fapi-interaction-id
      required: false
      description: An RFC4122 UID used as a correlation id.
      schema:
        type: string
    x-idempotency-key:
      name: x-idempotency-key
      in: header
      description: |
        Every request will be processed only once per x-idempotency-key.  The
        Idempotency Key will be valid for 24 hours.
      required: true
      schema:
        type: string
        maxLength: 40
        pattern: '^(?!\s)(.*)(\S)$'
    x-jws-signature:
      in: header
      name: x-jws-signature
      required: true
      description: A detached JWS signature of the body of the payload.
      schema:
        type: string
    x-client-id:
      in: header
      name: x-client-id
      required: false
      description: |
        Only used if the bank requires the client ID in order to return rate limit headers. 
        
        Client applications __must__ refer to the bank's developer portal for further information on any rate limit policies, if the headers are supported and any additional requirements.

        This header __must not__ be used for client authentication
      schema:
        type: string
  headers:
    RateLimit-Policy:
      required: false
      description: |
        Client applications __must__ refer to the bank's developer portal for further information on any rate limit policies, if the headers are supported and any additional requirements.

        A non-empty list of Quota Policy Items. The Item value __MUST__ be a String.

        Example:
        `RateLimit-Policy: "default";q=100;w=10`

        The **REQUIRED** "q" parameter indicates the quota allocated by this policy measured in quota units.

        The **OPTIONAL** "w" parameter value conveys a time window.
      schema:
        type: string
    RateLimit:
      required: false
      description: |
        Client applications __must__ refer to the bank's developer portal for further information on any rate limit policies, if the headers are supported and any additional requirements.

        A server uses the "RateLimit" response header field to communicate the current service limit for a quota policy for a particular partition key.

        Example:
        `RateLimit: "default";r=50;t=30`

        The **REQUIRED** "r" parameter value conveys the remaining quota units for the identified policy.

        The **OPTIONAL** "t" parameter value conveys the time window reset time for the identified policy.
      schema:
        type: string
  responses:
    201DomesticPaymentsCreated:
      description: Domestic Payments Created
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
        x-jws-signature:
          description: >
            Header containing a detached JWS signature of the body of the
            payload.
          required: true
          schema:
            type: string
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
      content:
        application/json; charset=utf-8:
          schema:
