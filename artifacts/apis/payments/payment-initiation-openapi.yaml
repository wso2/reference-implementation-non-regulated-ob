        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/DomesticPaymentRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DomesticPaymentRequest'
          application/jose+jwe:
            schema:
              $ref: '#/components/schemas/DomesticPaymentRequest'
        description: Default
        required: true
