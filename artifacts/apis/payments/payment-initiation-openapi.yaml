    RemittanceInformation:
      type: object
      description: >-
        Information supplied to enable the matching of an entry with the items
        that the transfer is intended to settle, such as commercial invoices in
        an accounts' receivable system
      properties:
        Structured:
          type: array
          items:
            $ref: '#/components/schemas/RemittanceStructured'
        Unstructured:
          type: array
          description: >-
            Information supplied to enable the matching/reconciliation of an
            entry with the items that the payment is intended to settle, such as
            commercial invoices in an accounts' receivable system, in an
            unstructured form.
          items:
            type: string
            maxLength: 140
            minLength: 1
    RemittanceStructured:
      type: object
      properties:
        ReferredDocumentInformation:
          type: array
          items:
            $ref: '#/components/schemas/ReferredDocumentInformation'
        ReferredDocumentAmount:
          $ref: '#/components/schemas/AmountSimpleType'
        CreditorReferenceInformation:
          description: 'Reference information provided by the creditor to allow the identification of the underlying documents.'
          type: object
          properties:
            Code:
              $ref: '#/components/schemas/ExternalCreditorReferenceType1Code'
            Issuer:
              description: 'Entity that assigns the identification.'
              type: string
              minLength: 1
              maxLength: 35
            Reference:
              description: 'Unique reference, as assigned by the creditor, to unambiguously refer to the payment transaction.'
              type: string
              minLength: 1
              maxLength: 35
        Invoicer:
          $ref: '#/components/schemas/Identification_3'
        Invoicee:
          $ref: '#/components/schemas/Identification_4'
        TaxRemittance:
          description: 'Provides remittance information about a payment made for tax-related purposes.'
          type: string
          maxLength: 140
          minLength: 1
        AdditionalRemittanceInformation:
          description: 'Additional information, in free text form, to complement the structured remittance information.'
          type: array
          items:
            type: string
            maxLength: 140
            minLength: 1
          maxItems: 3
    RegulatoryAuthority:
      type: object
      description: 'Entity requiring the regulatory reporting information. '
      properties:
        Name:
          type: string
          description: Name of the entity requiring the regulatory reporting information.
          minLength: 1
          maxLength: 140
        CountryCode:
          $ref: '#/components/schemas/CountryCode'
    RegulatoryReporting:
      type: object
      description: Information needed due to regulatory and statutory requirements
      properties:
        DebitCreditReportingIndicator:
          type: string
          description: >-
            Identifies whether the regulatory reporting information applies to
            the debit side, to the credit side or to both debit and credit sides
            of the transaction. 
            For a full list of values refer to `RegulatoryReportingType` in the ISO 20022 external code sets [here](https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets)
          enum:
            - CRED
            - DEBT
            - BOTH
        Authority:
          $ref: '#/components/schemas/RegulatoryAuthority'
        Details:
          type: array
          items:
            $ref: '#/components/schemas/StructuredRegulatoryReporting'
    PaymentRisk:
      type: object
      additionalProperties: false
      properties:
        PaymentContextCode:
          type: string
          description: |
            Specifies the payment context, `PaymentContextCode`<br>
            The following values are deprecated and <u>**must not**</u> be used in a new consent or payment. They may optionally be returned for a historical payment/consent migrated to v4:<br>
            * BillPayment - @deprecated
            * EcommerceGoods - @deprecated
            * EcommerceServices - @deprecated
            * PartyToParty - @deprecated
            * Other - @deprecated
          enum:
            - BillingGoodsAndServicesInAdvance
            - BillingGoodsAndServicesInArrears
            - EcommerceMerchantInitiatedPayment
            - FaceToFacePointOfSale
            - TransferToSelf
            - TransferToThirdParty
            # deprecated values
            - BillPayment
            - EcommerceGoods
            - EcommerceServices
            - PartyToParty
            - Other
        MerchantCategoryCode:
          type: string
          minLength: 3
          maxLength: 4
          description: >-
            Category code conform to ISO 18245, related to the type of services
            or goods the merchant provides for the transaction.
        MerchantCustomerIdentification:
          type: string
          minLength: 1
          maxLength: 70
          description: The unique identifier of the customer with the merchant.
        ContractPresentIndicator:
          type: boolean
          description: Indicates if Payee has a contractual relationship with the client application.
        BeneficiaryPrepopulatedIndicator:
          type: boolean
          description: >-
            Indicates if the client application has immutably prepopulated
            payment details for the customer.
        PaymentPurposeCode:
          $ref: '#/components/schemas/ExternalPurpose1Code'
        CategoryPurposeCode:
          $ref: '#/components/schemas/ExternalCategoryPurpose1Code'
        BeneficiaryAccountType:
          $ref: '#/components/schemas/ExtendedAccountType'
        DeliveryAddress:
          $ref: '#/components/schemas/PostalAddress'
      description: |-
        The Risk section is sent by the initiating party to the bank.
        It is used to specify additional details for risk scoring for Payments.
    StatusReason:
      type: object
      properties:
        StatusReasonCode:
          type: string
          description: |-
            Specifies the status reason in a code form. 
            For a full list of values refer to `StatusReasonCode` in the ISO 20022 external code sets [here](https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets)
          minLength: 1
          maxLength: 4
          example: ERIN
        StatusReasonDescription:
          description: Description supporting the StatusReasonCode.
          type: string
          minLength: 1
          maxLength: 500
        Path:
          type: string
          description: >-
            Path is optional but relevant when the status reason refers to an object/field and hence conditional to provide JSON path.
          minLength: 1
          maxLength: 500
    StructuredRegulatoryReporting:
      type: object
      description: >-
        Set of elements used to provide details on the regulatory reporting
        information.
      properties:
        Type:
          type: string
          description: >-
            Specifies the type of the information supplied in the regulatory
            reporting details
          minLength: 1
          maxLength: 35
        Date:
          $ref: '#/components/schemas/ISODateTime'
        Country:
          $ref: '#/components/schemas/CountryCode'
        Amount:
          $ref: '#/components/schemas/CurrencyAndAmount'
        Information:
          description: >-
            Additional details that cater for specific domestic regulatory
            requirements. 
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 35
    SupplementaryData:
      type: object
      properties: {}
      additionalProperties: true
      description: >-
        Additional information that can not be captured in the structured fields
        and/or any other specific block.
    DomesticPaymentRequest:
      type: object
      additionalProperties: false
      required:
        - Data
        - Risk
      properties:
        Data:
          type: object
          additionalProperties: false
          required:
            - ConsentId
            - Initiation
          properties:
            ConsentId:
              description: >-
                Unique identification as assigned by the bank to uniquely
                identify the consent resource.
              type: string
              minLength: 1
              maxLength: 128
            Initiation:
              type: object
              additionalProperties: false
              required:
                - InstructionIdentification
                - EndToEndIdentification
                - InstructedAmount
                - CreditorAccount
              description: >-
                The Initiation payload is sent by the initiating party to the
                bank. It is used to request movement of funds from the debtor
                account to a creditor for a single domestic payment.
              properties:
                InstructionIdentification:
                  description: >-
                    Unique identification as assigned by an instructing party
                    for an instructed party to unambiguously identify the
                    instruction.

                    Usage: the  instruction identification is a point to point
                    reference that can be used between the instructing party and
                    the instructed party to refer to the individual instruction.
                    It can be included in several messages related to the
                    instruction.
                  type: string
                  minLength: 1
                  maxLength: 35
                EndToEndIdentification:
                  description: >-
                    Unique identification assigned by the initiating party to
                    unambiguously identify the transaction. This identification
                    is passed on, unchanged, throughout the entire end-to-end
                    chain.

                    Usage: The end-to-end identification can be used for
                    reconciliation or to link tasks relating to the transaction.
                    It can be included in several messages related to the
                    transaction.

                    Some payment schemes can only process 31 characters
                    for the EndToEndIdentification field.
                  type: string
                  minLength: 1
                  maxLength: 35
                LocalInstrument:
                  $ref: '#/components/schemas/LocalInstrument'
                InstructedAmount:
                  type: object
                  additionalProperties: false
                  required:
                    - Amount
                    - Currency
                  description: >-
                    Amount of money to be moved between the debtor and creditor,
                    before deduction of charges, expressed in the currency as
                    ordered by the initiating party.

                    Usage: This amount has to be transported unchanged through
                    the transaction chain.
                  properties:
                    Amount:
                      $ref: >-
                        #/components/schemas/AmountSimpleType
                    Currency:
                      $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
                DebtorAccount:
                  type: object
                  additionalProperties: false
                  required:
                    - SchemeName
                    - Identification
                  description: >-
                    Unambiguous identification of the account of the debtor to
                    which a debit entry will be made as a result of the
                    transaction.
                  properties:
                    SchemeName:
                      $ref: >-
                        #/components/schemas/AccountSchemeName
                    Identification:
                      $ref: '#/components/schemas/Identification_0'
                    Name:
                      description: >-
                        The account name is the name or names of the account
                        owner(s) represented at an account level, as displayed
                        by the bank's online channels.

                        Note, the account name is not the product name or the
                        nickname of the account.
                      type: string
                      minLength: 1
                      maxLength: 350
                    SecondaryIdentification:
                      $ref: '#/components/schemas/SecondaryIdentification'
                    Proxy:
                      $ref: '#/components/schemas/Proxy'
                CreditorAgent:
                  type: object
                  additionalProperties: false
                  description: Financial institution servicing an account for the creditor.
                  properties:
                    SchemeName:
                      $ref: >-
                        #/components/schemas/FinancialInstitutionSchemeName
                    Identification:
                      $ref: '#/components/schemas/Identification_1'
                    Name:
                      $ref: '#/components/schemas/Name'
                    LEI:
                      $ref: '#/components/schemas/LEI'
                    PostalAddress:
                      $ref: '#/components/schemas/PostalAddress'
                CreditorAccount:
                  type: object
                  additionalProperties: false
                  required:
                    - SchemeName
                    - Identification
                    - Name
                  description: >-
                    Unambiguous identification of the account of the creditor to
                    which a credit entry will be posted as a result of the
                    payment transaction.
                  properties:
                    SchemeName:
                      $ref: >-
                        #/components/schemas/AccountSchemeName
                    Identification:
                      $ref: '#/components/schemas/Identification_0'
                    Name:
                      description: >-
                        The account name is the name or names of the account
                        owner(s) represented at an account level.

                        Note, the account name is not the product name or the
                        nickname of the account.

                        Banks may carry out name validation for
                        Confirmation of Payee, but it is not mandatory.
                      type: string
                      minLength: 1
                      maxLength: 350
                    SecondaryIdentification:
                      $ref: '#/components/schemas/SecondaryIdentification'
                    Proxy:
                      $ref: '#/components/schemas/Proxy'
                CreditorPostalAddress:
                  $ref: '#/components/schemas/PostalAddress'
                UltimateCreditor:
                  $ref: '#/components/schemas/UltimateCreditor'
                UltimateDebtor:
                  $ref: '#/components/schemas/UltimateDebtor'
                RegulatoryReporting:
                  type: array
                  items:
                    $ref: '#/components/schemas/RegulatoryReporting'
                  maxItems: 10
                RemittanceInformation:
                  $ref: '#/components/schemas/RemittanceInformation'
                SupplementaryData:
                  $ref: '#/components/schemas/SupplementaryData'
        Risk:
          $ref: '#/components/schemas/PaymentRisk'
