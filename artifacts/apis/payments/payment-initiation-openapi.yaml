        application/json:
          schema:
            $ref: '#/components/schemas/DomesticPaymentResponse'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/DomesticPaymentResponse'
    201DomesticScheduledPaymentsCreated:
