  schemas:
    RefundAccount:
      description: "Unambiguous identification of the refund account to which a refund will be made as a result of the transaction."
      type: object
      additionalProperties: false
      required:
        - Account
      properties:
        Account:
          type: object
          additionalProperties: false
          required:
            - SchemeName
            - Identification
            - Name
          description: Provides the details to identify an account.
          properties:
            SchemeName:
              $ref: >-
                #/components/schemas/AccountSchemeName
            Identification:
              $ref: '#/components/schemas/Identification_0'
            Name:
              description: >-
                Name of the account, as assigned by the account
                servicing institution.

                Usage: The account name is the name or names of the
                account owner(s) represented at an account level. The
                account name is not the product name or the nickname of
                the account.

                Banks may carry out name validation for
                Confirmation of Payee, but it is not mandatory.
              type: string
              minLength: 1
              maxLength: 350
            SecondaryIdentification:
              $ref: '#/components/schemas/SecondaryIdentification'
    NumberOfPayments:
      description: "Number of the payments that will be made in completing this frequency sequence including any executed since the sequence start date."
      type: "string"
      minLength: 1
      maxLength: 35
    Frequency_1:
      description: >-
        Individual Definitions:

        NotKnown - Not Known

        EvryDay - Every day

        EvryWorkgDay - Every working day

        IntrvlDay - An interval specified in number of calendar days (02 to 31)

        IntrvlWkDay - An interval specified in weeks (01 to 09), and the day
        within the week (01 to 07)

        WkInMnthDay - A monthly interval, specifying the week of the month (01
        to 05) and day within the week (01 to 07)

        IntrvlMnthDay - An interval specified in months (between 01 to 06, 12,
        24), specifying the day within the month (-05 to -01, 01 to 31)

        Individual Patterns:

        NotKnown (ScheduleCode)

        EvryDay (ScheduleCode)

        EvryWorkgDay (ScheduleCode)

        IntrvlDay:NoOfDay (ScheduleCode + NoOfDay)

        IntrvlWkDay:IntervalInWeeks:DayInWeek (ScheduleCode + IntervalInWeeks +
        DayInWeek)

        WkInMnthDay:WeekInMonth:DayInWeek (ScheduleCode + WeekInMonth +
        DayInWeek)

        IntrvlMnthDay:IntervalInMonths:DayInMonth (ScheduleCode +
        IntervalInMonths + DayInMonth)

        The regular expression for this element combines seven smaller versions
        for each permitted pattern. To aid legibility - the components are
        presented individually here:

        NotKnown

        EvryDay

        EvryWorkgDay

        IntrvlDay:((0[2-9])|([1-2][0-9])|3[0-1])

        IntrvlWkDay:0[1-9]:0[1-7]

        WkInMnthDay:0[1-5]:0[1-7]

        IntrvlMnthDay:(0[1-6]|12|24):(-0[1-5]|0[1-9]|[12][0-9]|3[01])

        Full Regular Expression:

        ^(NotKnown)$|^(EvryDay)$|^(EvryWorkgDay)$|^(IntrvlDay:((0[2-9])|([1-2][0-9])|3[0-1]))$|^(IntrvlWkDay:0[1-9]:0[1-7])$|^(WkInMnthDay:0[1-5]:0[1-7])$|^(IntrvlMnthDay:(0[1-6]|12|24):(-0[1-5]|0[1-9]|[12][0-9]|3[01]))$
      type: string
      pattern: '^(NotKnown)$|^(EvryDay)$|^(EvryWorkgDay)$|^(IntrvlDay:((0[2-9])|([1-2][0-9])|3[0-1]))$|^(IntrvlWkDay:0[1-9]:0[1-7])$|^(WkInMnthDay:0[1-5]:0[1-7])$|^(IntrvlMnthDay:(0[1-6]|12|24):(-0[1-5]|0[1-9]|[12][0-9]|3[01]))$'
    UltimateCreditor:
      description: Ultimate party to which an amount of money is due.
      type: object
      properties:
        Name:
          description: >-
            Name by which a party is known and which is usually used to identify
            that party.
          type: string
          minLength: 1
          maxLength: 140
        Identification:
          description: Identification assigned by an institution.
          type: string
          minLength: 1
          maxLength: 256
        LEI:
          $ref: '#/components/schemas/LEI'
        SchemeName:
          $ref: '#/components/schemas/AccountSchemeName'
        PostalAddress:
          $ref: '#/components/schemas/PostalAddress'
    UltimateDebtor:
      description: Ultimate party that owes an amount of money to the (ultimate) creditor.
      type: object
      properties:
        Name:
          description: >-
            Name by which a party is known and which is usually used to identify
            that party.
          type: string
          minLength: 1
          maxLength: 140
        Identification:
          description: Identification assigned by an institution.
          type: string
          minLength: 1
          maxLength: 256
        LEI:
          $ref: '#/components/schemas/LEI'
        SchemeName:
          $ref: '#/components/schemas/AccountSchemeName'
        PostalAddress:
          $ref: '#/components/schemas/PostalAddress'
    Frequency:
      description: >-
        Regularity with which credit transfer instructions are to be created and
        processed
      type: object
      required:
        - Type
      properties:
        Type:
          oneOf:
            - $ref: '#/components/schemas/FrequencyCode'
            - $ref: "#/components/schemas/Frequency_1"
        CountPerPeriod:
          description: >-
            Number of instructions to be created and processed during the
            specified period .Specifies a frequency in terms of a count per
            period within a specified frequency type. Note: should not be used
            alongside `PointInTime`
          type: integer
          example: 1
          format: int32
        PointInTime:
          $ref: '#/components/schemas/PointInTime'
    PointInTime:
      description: >-
        Exact2NumericText - Further information on the exact point in time the
        event should take place. Specifies a frequency in terms of an exact
        point in time or moment within a specified frequency type. Note: should
        not be used alongside `CountPerPeriod`.
      type: string
      example: '00'
      maxLength: 2
    ActiveOrHistoricCurrencyCode:
      description: >-
        A code allocated to a currency by a Maintenance Agency under an
        international identification scheme, as described in the latest edition
        of the international standard ISO 4217 "Codes for the representation of
        currencies and funds".
      type: string
      pattern: '^[A-Z]{3,3}$'
    BuildingName:
      description: Name of a referenced building.
      type: string
      minLength: 1
      maxLength: 140
    BuildingNumber:
      description: Number that identifies the position of a building on a street.
      type: string
      minLength: 1
      maxLength: 16
    ExternalCategoryPurpose1Code:
      description: >-
        Enumeration of codes that outlines the type of purpose behind a
        transaction, payment or risk. 
         For all enum values see `ExternalCategoryPurpose1Code` [here](https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets)
