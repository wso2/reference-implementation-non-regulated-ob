        - LBOX
        - LOAN
        - MP2B
        - MP2P
        - OTHR
        - PENS
        - RPRE
        - RRCT
        - RVPM
        - SALA
        - SECU
        - SSBE
        - SUPP
        - SWEP
        - TAXS
        - TOPG
        - TRAD
        - TREA
        - VATX
        - VOST
        - WHLD
        - ZABA
    CommunicationMethod:
      description: >-
        Method by which statements are communicated to the account owner, in a
        coded form.
      type: string
      enum:
        - EMAL
        - FAXI
        - FILE
        - ONLI
        - POST
    TransactionCreditDebitIndicator:
      description: >-
        Indicates whether the transaction is a credit or a debit entry.
      type: string
      enum:
        - Credit
        - Debit
    BalanceCreditDebitIndicator:
      description: |-
        Indicates whether the balance is a credit or a debit balance.
        Usage: A zero balance is considered to be a credit balance.
      type: string
      example: Credit
      enum:
        - Credit
        - Debit
    CurrencyExchange:
      type: object
      required:
        - SourceCurrency
        - ExchangeRate
      description: Set of elements used to provide details on the currency exchange.
      properties:
        SourceCurrency:
          description: >-
            Currency from which an amount is to be converted in a currency
            conversion.
          type: string
          pattern: '^[A-Z]{3,3}$'
        TargetCurrency:
          description: >-
            Currency into which an amount is to be converted in a currency
            conversion.
          type: string
          pattern: '^[A-Z]{3,3}$'
        UnitCurrency:
          description: >-
            Currency in which the rate of exchange is expressed in a currency
            exchange. In the example 1EUR = xxxCUR, the unit currency is EUR.
          type: string
          pattern: '^[A-Z]{3,3}$'
        ExchangeRate:
          description: >-
            Factor used to convert an amount from one currency into another.
            This reflects the price at which one currency was bought with
            another currency.

            Usage: ExchangeRate expresses the ratio between UnitCurrency and
            QuotedCurrency (ExchangeRate = UnitCurrency/QuotedCurrency).
          type: number
        ContractIdentification:
          description: >-
            Unique identification to unambiguously identify the foreign exchange
            contract.
          type: string
          minLength: 1
          maxLength: 35
        QuotationDate:
          description: >-
            Date and time at which an exchange rate is quoted. All dates in the
            JSON payloads are represented in ISO 8601 date-time format. 

            All date-time fields in responses must include the timezone. An
            example is below:

            2017-04-05T10:43:07+00:00
          type: string
          format: date-time
        InstructedAmount:
          type: object
          required:
            - Amount
            - Currency
          description: >-
            Amount of money to be moved between the debtor and creditor, before
            deduction of charges, expressed in the currency as ordered by the
            initiating party.
          properties:
            Amount:
              $ref: '#/components/schemas/AmountSimpleType'
            Currency:
              $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode_1'
    ExternalEntryStatus1Code:
      description: |-
        Status of a transaction entry on the books of the account servicer. <br />
        For a full list of enumeration values refer to `ExternalEntryStatus1Code` in the ISO 20022 external code sets [here](https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets)
      type: string
      enum:
        - BOOK
        - FUTR
        - INFO
        - PDNG
        - RJCT
    TransactionMutability:
      description: Specifies the Mutability of the Transaction record.
      type: string
      enum:
        - Mutable
        - Immutable
    Error:
      type: object
      properties:
        ErrorCode:
          description: Low level textual error code.
          type: string
          minLength: 1
          maxLength: 40
        Message:
          description: >-
            A description of the error that occurred. e.g., 'A mandatory field
            isn't supplied' or 'RequestedExecutionDateTime must be in future'
          type: string
          minLength: 1
          maxLength: 500
        Path:
          description: >-
            Recommended but optional reference to the JSON Path of the field
            with error, e.g., Data.Initiation.InstructedAmount.Currency
          type: string
          minLength: 1
          maxLength: 500
        Url:
          description: >-
            URL to help remediate the problem, or provide more information, or
            to API Reference, or help etc
          type: string
      additionalProperties: false
      minProperties: 1
    ErrorResponse:
      description: >-
        An array of detail error codes, and messages, and URLs to documentation
        to help remediation.
      type: object
      properties:
        Id:
          description: >-
            A unique reference for the error instance, for audit purposes, in
            case of unknown/unclassified errors.
          type: string
          minLength: 1
          maxLength: 40
        Code:
          description: >-
            Deprecated <br />High level textual error code, to help categorise the
            errors.
          type: string
          minLength: 1
          example: 400 BadRequest
          maxLength: 40
        Message:
          description: Deprecated <br />Brief Error message
          type: string
          minLength: 1
          example: There is something wrong with the request parameters provided
          maxLength: 500
        Errors:
          items:
            $ref: '#/components/schemas/Error'
          type: array
          minItems: 1
      required:
        - Errors
      additionalProperties: false
