  schemas:
    IntermediaryAgent:
      description: "The intermediary agent associated with this transaction."
      type: object
      properties:
        Name:
          description: "Name by which an agent is known and which is usually used to identify that agent."
          type: string
          minLength: 1
          maxLength: 140
        SchemeName:
          $ref: '#/components/schemas/AccountSchemeName'
        Identification:
          description: "Unique and unambiguous identification of a financial institution or a branch of a financial institution."
          type: string
          minLength: 1
          maxLength: 35
        LEI:
          $ref: '#/components/schemas/LEI'
        PostalAddress:
          $ref: '#/components/schemas/PostalAddress'
        ProcessingStatus:
          description: |-
            Status of the payment at the Intermediary Agent.

            Individual values:

            * `PDNG` - Pending: received but not yet acted on.
            * `RCVD` - Received: accepted into the agent's processing queue.
            * `ACSP` - Accepted, settlement in progress.
            * `ACSC` - Accepted, settlement completed.
            * `RJCT` - Rejected: the agent refused the payment.
          type: string
          enum:
            - PDNG
            - RCVD
            - ACSP
            - ACSC
            - RJCT
            - UNKN
            - CANC
    UltimateCreditor:
      description: Ultimate party to which an amount of money is due.
      type: object
      properties:
        Name:
          description: >-
            Name by which a party is known and which is usually used to identify
            that party.
          type: string
          minLength: 1
          maxLength: 140
        Identification:
          description: Identification assigned by an institution.
          type: string
          minLength: 1
          maxLength: 256
        LEI:
          $ref: '#/components/schemas/LEI'
        SchemeName:
          $ref: '#/components/schemas/AccountSchemeName'
        PostalAddress:
          $ref: '#/components/schemas/PostalAddress'
    UltimateDebtor:
      description: Ultimate party that owes an amount of money to the (ultimate) creditor.
      type: object
      properties:
        Name:
          description: >-
            Name by which a party is known and which is usually used to identify
            that party.
          type: string
          minLength: 1
          maxLength: 140
        Identification:
          description: Identification assigned by an institution.
          type: string
          minLength: 1
          maxLength: 256
        LEI:
          $ref: '#/components/schemas/LEI'
        SchemeName:
          $ref: '#/components/schemas/AccountSchemeName'
        PostalAddress:
          $ref: '#/components/schemas/PostalAddress'
    Proxy:
      description: >-
        Specifies an alternate assumed name for the identification of the
        account.
      type: object
      required:
        - Identification
        - Code
      properties:
        Identification:
          description: >-
            Identification used to indicate the account identification under
            another specified name.
          type: string
          example: '2360549017905188'
          minLength: 1
          maxLength: 2048
        Code:
          $ref: '#/components/schemas/ExternalProxyAccountType1Code'
        Type:
          type: string
          description: Type of the proxy identification.
          minLength: 1
          maxLength: 35
    ExternalProxyAccountType1Code:
      description: >-
        Specifies the external proxy account type code, as published in the
        proxy account type external code set.<br /> For more information and a
        full list of values see `ExternalProxyAccountType1Code` in the ISO 20022 external code sets
        [here](https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets)
      type: string
      example: TELE
      enum:
        - TELE
        - EMAL
        - DNAM
        - CINC
        - COTX
        - COID
        - CUST
        - DRLC
        - EIDN
        - EWAL
        - PVTX
        - LEIC
        - MBNO
        - NIDN
        - CCPT
        - SHID
        - SOSE
        - TOKN
        - UBIL
        - VIPN
        - BIID
    AccountId:
      description: >-
        A unique and immutable identifier used to identify the account resource.
        This identifier has no meaning to the account owner.

        Use this value as the `AccountId` path parameter of `getAccountById`,
        `getAccountBalances` and `getAccountTransactions`. Obtain it from
        `listConsentedAccounts`; it must not be constructed or guessed.
      type: string
      example: '22289'
      minLength: 1
      maxLength: 40
    ActiveOrHistoricCurrencyCode_0:
      description: >-
        Identification of the currency in which the account is held. 

        Usage: Currency should only be used in case one and the same account
        number covers several currencies

        and the initiating party needs to identify which currency needs to be
        used for settlement on the account.
      type: string
      pattern: '^[A-Z]{3,3}$'
    ActiveOrHistoricCurrencyCode_1:
      description: >-
        A code allocated to a currency by a Maintenance Agency under an
        international identification scheme, as described in the latest edition
        of the international standard ISO 4217 "Codes for the representation of
        currencies and funds".
      type: string
      example: EUR
      pattern: '^[A-Z]{3,3}$'
    AddressLine:
      description: >-
        Information that locates and identifies a specific address for a
        transaction entry, that is presented in free format text.
      type: string
      minLength: 1
      maxLength: 70
    BookingDateTime:
      description: >-
        Date and time when a transaction entry is posted to an account on the
        account servicer's books.

        Usage: Booking date is the expected booking date, unless the status is
        booked, in which case it is the actual booking date. All dates in the
        JSON payloads are represented in ISO 8601 date-time format. 

        All date-time fields in responses must include the timezone. An example
        is below:

        2017-04-05T10:43:07+00:00
      type: string
      format: date-time
    BuildingName:
      description: Name of a referenced building.
      type: string
      minLength: 1
      maxLength: 140
    BuildingNumber:
      description: Number that identifies the position of a building on a street.
      type: string
      example: '11'
      minLength: 1
      maxLength: 16
    CareOf:
      description: >-
        The 'care of' address is used whenever sending mail to a person or
        organisation who does not actually live or work at the address. They
        will receive the mail for the individual.
      type: string
      example: Jane Smith
      minLength: 1
      maxLength: 140
    Description_0:
      description: Specifies the description of the account type.
      type: string
      minLength: 1
      maxLength: 35
    DistrictName:
      description: >-
        Number that of the regional area, known as a district, which forms part
        of an address
      type: string
      example: North Holland
      minLength: 1
      maxLength: 140
    Floor:
      description: Number that identifies the level within a building
      type: string
      example: '11'
      minLength: 1
      maxLength: 70
    ISODateTime:
      description: >-
        All dates in the JSON payloads are represented in ISO 8601 date-time
        format. 

        All date-time fields in responses must include the timezone. An example
        is below:

        2017-04-05T10:43:07+00:00
      type: string
      format: date-time
    Identification_0:
      description: >-
        Identification assigned by an institution to identify an account. This
        identification is known by the account owner.
      type: string
      example: '5500007788'
      minLength: 1
      maxLength: 256
    Identification_1:
      description: Unique and unambiguous identification of the servicing institution.
      type: string
      example: '5500007788'
      minLength: 1
      maxLength: 35
    Identification_2:
      description: >-
        Unique and unambiguous identification of a financial institution or a
        branch of a financial institution.
      type: string
      minLength: 1
      maxLength: 35
    LEI:
      description: >-
        Legal entity identification as an alternate identification for a party.
        Legal Entity Identifier is a code allocated to a party as described in
        ISO 17442 "Financial Services - Legal Entity Identifier (LEI)".
      type: string
      example: IZ9Q00LZEVUKWCQY6X15
      minLength: 1
      maxLength: 20
      pattern: '^[A-Z0-9]{18,18}[0-9]{2,2}$'
    Links:
      type: object
      description: Links relevant to the payload
      properties:
        Self:
          description: Absolute URI of the current page of results.
          type: string
          format: uri
        First:
          description: >-
            Absolute URI of the first page of results. Absent when the current
            page is already the first.
          type: string
          format: uri
        Prev:
          description: >-
            Absolute URI of the previous page of results. Absent when the
            current page is the first.
          type: string
          format: uri
        Next:
          description: >-
            Absolute URI of the next page of results. Absent when the current
            page is the last — follow this URI until it is no longer returned
            rather than constructing page URIs yourself.
          type: string
          format: uri
        Last:
          description: >-
            Absolute URI of the last page of results. Absent when the current
            page is already the last.
          type: string
          format: uri
      additionalProperties: false
      required:
        - Self
    MaturityDate:
      description: >-
        Maturity date of the account. All dates in the JSON payloads are
        represented in ISO 8601 date-time format. 

        All date-time fields in responses must include the timezone. An example
        is below:

        2017-04-05T10:43:07+00:00
      type: string
      format: date-time
    Meta:
      title: MetaData
      type: object
      description: Meta Data relevant to the payload
      properties:
        TotalPages:
          description: Total number of pages available for the current query.
          type: integer
          format: int32
        FirstAvailableDateTime:
          $ref: '#/components/schemas/ISODateTime'
        LastAvailableDateTime:
          $ref: '#/components/schemas/ISODateTime'
      additionalProperties: false
    Name_0:
      description: >-
        The account name is the name or names of the account owner(s)
        represented at an account level, as displayed by the bank's online
        channels.

        Note, the account name is not the product name or the nickname of the
        account.
      type: string
      example: Jane Smith
      minLength: 1
      maxLength: 350
    Name_1:
      description: >-
        Name by which an agent is known and which is usually used to identify
        that agent.
      type: string
      example: Agent Name
      minLength: 1
      maxLength: 140
    Nickname:
      description: >-
        The nickname of the account, assigned by the account owner in order to
        provide an additional means of identification of the account.
      type: string
      minLength: 1
      maxLength: 70
    Account:
      type: object
      description: >-
        Unambiguous identification of the account to which credit and debit
        entries are made. The following fields are optional only for accounts
        that are switched:

          * Data.Currency  
          * Data.AccountCategory  
          * Data.AccountTypeCode

        For all other accounts, the fields must be populated by the bank.
      required:
        - AccountId
      properties:
        AccountId:
          $ref: '#/components/schemas/AccountId'
        Status:
          $ref: '#/components/schemas/AccountStatus'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/StatusUpdateDateTime'
        Currency:
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode_0'
        AccountCategory:
          $ref: '#/components/schemas/AccountType'
        AccountTypeCode:
          $ref: '#/components/schemas/AccountSubType'
        Description:
          $ref: '#/components/schemas/Description_0'
        Nickname:
          $ref: '#/components/schemas/Nickname'
        OpeningDate:
          $ref: '#/components/schemas/OpeningDate'
        MaturityDate:
          $ref: '#/components/schemas/MaturityDate'
        Account:
          description: >-
            The identifications by which this account is addressed externally,
            such as its IBAN or sort-code/account-number pair. More than one
            entry may be present when the account is reachable by several
            schemes.
          type: array
          items:
            type: object
            description: Provides the details to identify an account.
            required:
              - SchemeName
              - Identification
            properties:
              SchemeName:
                $ref: '#/components/schemas/AccountSchemeName'
              Identification:
                $ref: '#/components/schemas/Identification_0'
              Name:
                $ref: '#/components/schemas/Name_0'
              LEI:
                $ref: '#/components/schemas/LEI'
              SecondaryIdentification:
                $ref: '#/components/schemas/SecondaryIdentification'
        StatementFrequencyAndFormat:
          description: >-
            How often statements are issued for this account and in which
            formats they are made available.
          allOf:
            - $ref: '#/components/schemas/StatementFrequencyAndFormat'
        Servicer:
          $ref: '#/components/schemas/AccountServicer'
      additionalProperties: false
    AccountStatus:
      description: |-
        Specifies the status of account resource in code form.

        Individual values:

        * `Deleted` - The account is closed and no longer exists at the bank.
        * `Disabled` - The account exists but is temporarily blocked from use.
        * `Enabled` - The account is open and operating normally.
        * `Pending` - The account has been requested but is not yet open.
        * `ProForma` - The account is provisional and not yet fully opened.
      type: string
      example: Enabled
      enum:
        - Deleted
        - Disabled
        - Enabled
        - Pending
        - ProForma
    AmountSimpleType:
      description: >-
        A number of monetary units specified in an active currency where the
        unit of currency is explicit and compliant with ISO 4217.
      type: string
      example: '1209.06'
      pattern: '^\d{1,13}$|^\d{1,13}\.\d{1,5}$'
    ChargeAmount:
      type: object
      required:
        - Amount
        - Currency
      description: Transaction charges to be paid by the charge bearer.
      properties:
        Amount:
          $ref: '#/components/schemas/AmountSimpleType'
        Currency:
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode_1'
    TransactionAmount:
      type: object
      required:
        - Amount
        - Currency
      description: Amount of money in the cash transaction entry.
      properties:
        Amount:
          $ref: '#/components/schemas/AmountSimpleType'
        Currency:
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode_1'
    AddressType:
      description: Identifies the nature of the postal address.
      type: string
      example: BIZZ
      enum:
        - BIZZ
        - DLVY
        - MLTO
        - PBOX
        - ADDR
        - HOME
        - CORR
        - STAT
    BalanceType:
      description: >-
        Balance type, in a coded form. <br />
        For a full list of enumeration values refer to `ExternalBalanceType1Code` in the ISO 20022 external code sets [here](https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets).

        Individual values:

        * `CLAV` - Closing available: balance available for use after pending items are applied.
        * `CLBD` - Closing booked: balance of settled items only, excluding anything pending.
        * `FWAV` - Forward available: balance available at a stated future date.
        * `INFO` - Informational: provided for information only, not for reconciliation.
        * `ITAV` - Interim available: available balance calculated part-way through the business day.
        * `ITBD` - Interim booked: booked balance calculated part-way through the business day.
        * `OPAV` - Opening available: balance available at the start of the business day.
        * `OPBD` - Opening booked: booked balance at the start of the business day.
        * `PRCD` - Previously closed booked: booked balance at the close of the prior period.
        * `XPCD` - Expected: balance projected once all known items settle.
      type: string
      example: CLAV
      enum:
        - CLAV
        - CLBD
        - FWAV
        - INFO
        - ITAV
        - ITBD
        - OPAV
        - OPBD
        - PRCD
        - XPCD
    BankTransactionCode:
      type: object
      required:
        - Code
        - SubCode
      description: >-
        Set of elements used to fully identify the type of underlying
        transaction resulting in an entry.
      properties:
        Code:
          description: Specifies the family within a domain.
          type: string
        SubCode:
          description: Specifies the sub-product family within a specific family.
          type: string
    AccountServicer:
      type: object
      required:
        - SchemeName
        - Identification
      description: >-
        Party that manages the account on behalf of the account owner, that is
        manages the registration and booking of entries on the account,
        calculates balances on the account and provides information about the
        account.
      properties:
        SchemeName:
          $ref: '#/components/schemas/FinancialInstitutionSchemeName'
        Identification:
          $ref: '#/components/schemas/Identification_1'
        Name:
          $ref: '#/components/schemas/Name_1'
    CreditorAgent:
      type: object
      description: Financial institution servicing an account for the creditor.
      properties:
        SchemeName:
          $ref: '#/components/schemas/FinancialInstitutionSchemeName'
        Identification:
          $ref: '#/components/schemas/Identification_2'
        Name:
          $ref: '#/components/schemas/Name_1'
        LEI:
          $ref: '#/components/schemas/LEI'
        PostalAddress:
          $ref: '#/components/schemas/PostalAddress'
    DebtorAgent:
      type: object
      description: Financial institution servicing an account for the debtor.
      properties:
        SchemeName:
          $ref: '#/components/schemas/FinancialInstitutionSchemeName'
        Identification:
          $ref: '#/components/schemas/Identification_2'
        Name:
          $ref: '#/components/schemas/Name_1'
        LEI:
          $ref: '#/components/schemas/LEI'
        PostalAddress:
          $ref: '#/components/schemas/PostalAddress'
    CreditorAccount:
      type: object
      description: >-
        Unambiguous identification of the account of the creditor, in the case
        of a debit transaction.
      properties:
        SchemeName:
          $ref: '#/components/schemas/AccountSchemeName'
        Identification:
          $ref: '#/components/schemas/Identification_0'
        Name:
          $ref: '#/components/schemas/Name_0'
        SecondaryIdentification:
          $ref: '#/components/schemas/SecondaryIdentification'
        Proxy:
          $ref: '#/components/schemas/Proxy'
    DebtorAccount:
      type: object
      description: >-
        Unambiguous identification of the account of the debtor, in the case of
        a credit transaction.
      properties:
        SchemeName:
          $ref: '#/components/schemas/AccountSchemeName'
        Identification:
          $ref: '#/components/schemas/Identification_0'
        Name:
          $ref: '#/components/schemas/Name_0'
        SecondaryIdentification:
          $ref: '#/components/schemas/SecondaryIdentification'
        Proxy:
          $ref: '#/components/schemas/Proxy'
    ExternalCategoryPurpose1Code:
      description: >-
        Enumeration of codes that outlines the type of purpose behind a
        transaction, payment or risk. 
        For all enum values see `ExternalCategoryPurpose1Code` in the ISO 20022 external code sets [here](https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets)
      type: string
      enum:
        - BONU
        - CASH
        - CBLK
        - CCRD
        - CGWV
        - CIPC
        - CONC
        - CORT
        - DCRD
        - DIVI
        - DVPM
        - EPAY
        - FCDT
        - FCIN
        - FCOL
        - GOVT
        - GP2P
        - HEDG
        - ICCP
        - IDCP
        - INTC
        - INTE
        - LBOX
        - LOAN
        - MP2B
        - MP2P
        - OTHR
        - PENS
        - RPRE
        - RRCT
        - RVPM
        - SALA
        - SECU
        - SSBE
        - SUPP
        - SWEP
        - TAXS
        - TOPG
        - TRAD
        - TREA
        - VATX
        - VOST
        - WHLD
        - ZABA
    CommunicationMethod:
      description: >-
        Method by which statements are communicated to the account owner, in a
        coded form.
      type: string
      enum:
        - EMAL
        - FAXI
        - FILE
        - ONLI
        - POST
    TransactionCreditDebitIndicator:
      description: >-
        Indicates whether the transaction is a credit or a debit entry.
      type: string
      enum:
        - Credit
        - Debit
    BalanceCreditDebitIndicator:
      description: |-
        Indicates whether the balance is a credit or a debit balance.
        Usage: A zero balance is considered to be a credit balance.
      type: string
      example: Credit
      enum:
        - Credit
        - Debit
    CurrencyExchange:
      type: object
      required:
        - SourceCurrency
        - ExchangeRate
      description: Set of elements used to provide details on the currency exchange.
      properties:
        SourceCurrency:
          description: >-
            Currency from which an amount is to be converted in a currency
            conversion.
          type: string
          pattern: '^[A-Z]{3,3}$'
        TargetCurrency:
          description: >-
            Currency into which an amount is to be converted in a currency
            conversion.
          type: string
          pattern: '^[A-Z]{3,3}$'
        UnitCurrency:
          description: >-
            Currency in which the rate of exchange is expressed in a currency
            exchange. In the example 1EUR = xxxCUR, the unit currency is EUR.
          type: string
          pattern: '^[A-Z]{3,3}$'
        ExchangeRate:
          description: >-
            Factor used to convert an amount from one currency into another.
            This reflects the price at which one currency was bought with
            another currency.

            Usage: ExchangeRate expresses the ratio between UnitCurrency and
            QuotedCurrency (ExchangeRate = UnitCurrency/QuotedCurrency).
          type: number
        ContractIdentification:
          description: >-
            Unique identification to unambiguously identify the foreign exchange
            contract.
          type: string
          minLength: 1
          maxLength: 35
        QuotationDate:
          description: >-
            Date and time at which an exchange rate is quoted. All dates in the
            JSON payloads are represented in ISO 8601 date-time format. 

            All date-time fields in responses must include the timezone. An
            example is below:

            2017-04-05T10:43:07+00:00
          type: string
          format: date-time
        InstructedAmount:
          type: object
          required:
            - Amount
            - Currency
          description: >-
            Amount of money to be moved between the debtor and creditor, before
            deduction of charges, expressed in the currency as ordered by the
            initiating party.
          properties:
            Amount:
              $ref: '#/components/schemas/AmountSimpleType'
            Currency:
              $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode_1'
    ExternalEntryStatus1Code:
      description: |-
        Status of a transaction entry on the books of the account servicer. <br />
        For a full list of enumeration values refer to `ExternalEntryStatus1Code` in the ISO 20022 external code sets [here](https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets)

        Individual values:

        * `BOOK` - Booked: the entry has settled and affects the booked balance.
        * `FUTR` - Future: the entry is scheduled for a future date.
        * `INFO` - Information: provided for information only.
        * `PDNG` - Pending: the entry is authorised but has not yet settled.
        * `RJCT` - Rejected: the entry was refused and will not settle.
      type: string
      enum:
        - BOOK
        - FUTR
        - INFO
        - PDNG
        - RJCT
    TransactionMutability:
      description: Specifies the Mutability of the Transaction record.
      type: string
      enum:
        - Mutable
        - Immutable
    Error:
      type: object
      properties:
        ErrorCode:
          description: Low level textual error code.
          type: string
          minLength: 1
          maxLength: 40
        Message:
          description: >-
            A description of the error that occurred. e.g., 'A mandatory field
            isn't supplied' or 'RequestedExecutionDateTime must be in future'
          type: string
          minLength: 1
          maxLength: 500
        Path:
          description: >-
            Recommended but optional reference to the JSON Path of the field
            with error, e.g., Data.Initiation.InstructedAmount.Currency
          type: string
          minLength: 1
          maxLength: 500
        Url:
          description: >-
            URL to help remediate the problem, or provide more information, or
            to API Reference, or help etc
          type: string
      additionalProperties: false
      minProperties: 1
    ErrorResponse:
      description: >-
        An array of detail error codes, and messages, and URLs to documentation
        to help remediation.
      type: object
      properties:
        Id:
          description: >-
            A unique reference for the error instance, for audit purposes, in
            case of unknown/unclassified errors.
          type: string
          minLength: 1
          maxLength: 40
        Code:
          description: >-
            Deprecated <br />High level textual error code, to help categorise the
            errors.
          type: string
          minLength: 1
          example: 400 BadRequest
          maxLength: 40
        Message:
          description: Deprecated <br />Brief Error message
          type: string
          minLength: 1
          example: There is something wrong with the request parameters provided
          maxLength: 500
        Errors:
          description: >-
            One entry per distinct problem found with the request. Always
            contains at least one entry.
          items:
            $ref: '#/components/schemas/Error'
          type: array
          minItems: 1
      required:
        - Errors
      additionalProperties: false
