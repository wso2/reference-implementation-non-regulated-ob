        - WEEK
        - NONE
        - SLCT
    FileFormat:
      description: >-
        For a full list of enumeration values refer to `ExternalDocumentFormat1Code` in the ISO 20022 external code sets [here](https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets)
      type: string
      enum:
        - DPDF
        - DXML
        - SDSH
        - WORD
        - XSLT
        - DCSV
    MerchantDetails:
      type: object
      description: Details of the merchant involved in the transaction.
      properties:
        MerchantName:
          description: Name by which the merchant is known.
          type: string
          minLength: 1
          maxLength: 350
        MerchantCategoryCode:
          description: >-
            Category code conform to ISO 18245, related to the type of services
            or goods the merchant provides for the transaction.
          type: string
          minLength: 3
          maxLength: 4
    PostalAddress:
      type: object
      description: >-
        Information that locates and identifies a specific address, as defined
        by postal services.
      properties:
        AddressType:
          $ref: '#/components/schemas/AddressType'
        Department:
          description: Identification of a division of a large organisation or building.
          example: Finance
          type: string
          minLength: 1
          maxLength: 70
        SubDepartment:
          description: >-
            Identification of a sub-division of a large organisation or
            building.
          example: Payroll
          type: string
          minLength: 1
          maxLength: 70
        StreetName:
          $ref: '#/components/schemas/StreetName'
        BuildingNumber:
          $ref: '#/components/schemas/BuildingNumber'
        BuildingName:
          $ref: '#/components/schemas/BuildingName'
        Floor:
          $ref: '#/components/schemas/Floor'
        UnitNumber:
          $ref: '#/components/schemas/UnitNumber'
        Room:
          $ref: '#/components/schemas/Room'
        PostBox:
          $ref: '#/components/schemas/PostBox'
        TownLocationName:
          $ref: '#/components/schemas/TownName'
        DistrictName:
          $ref: '#/components/schemas/DistrictName'
        CareOf:
          $ref: '#/components/schemas/CareOf'
        PostCode:
          $ref: '#/components/schemas/PostCode'
        TownName:
          $ref: '#/components/schemas/TownName'
        CountrySubDivision:
          description: Identifies a subdivision of a country such as state, region, county.
          type: string
          minLength: 1
          maxLength: 35
        Country:
          description: Nation with its own government.
          type: string
          pattern: '^[A-Z]{2,2}$'
        AddressLine:
          type: array
          items:
            description: >-
              Information that locates and identifies a specific address, as
              defined by postal services, presented in free format text.
            type: string
            minLength: 1
            maxLength: 70
          minItems: 0
          maxItems: 7
    AccountsResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          properties:
            Account:
              type: array
              items:
                $ref: '#/components/schemas/Account'
        Links:
          $ref: '#/components/schemas/Links'
        Meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
    BalancesResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - Balance
          properties:
            Balance:
              type: array
              items:
                type: object
                description: Set of elements used to define the balance details.
                required:
                  - AccountId
                  - CreditDebitIndicator
                  - Type
                  - DateTime
                  - Amount
                properties:
                  AccountId:
                    $ref: '#/components/schemas/AccountId'
                  CreditDebitIndicator:
                    $ref: '#/components/schemas/BalanceCreditDebitIndicator'
                  Type:
                    $ref: '#/components/schemas/BalanceType'
                  DateTime:
                    description: >-
                      Indicates the date (and time) of the balance. All dates in
                      the JSON payloads are represented in ISO 8601 date-time
                      format. 

                      All date-time fields in responses must include the
                      timezone. An example is below:

                      2017-04-05T10:43:07+00:00
                    type: string
                    format: date-time
                  Amount:
                    type: object
                    required:
                      - Amount
                      - Currency
                    description: Amount of money of the cash balance.
                    properties:
                      Amount:
                        $ref: '#/components/schemas/AmountSimpleType'
                      Currency:
                        $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode_1'
                      SubType:
                        description: >-
                          Balance sub type, in a coded form. Default if not specified is BCUR of the account
                        type: string
                        enum:
                          - BCUR
                          - LCUR
                        default: BCUR
                  CreditLine:
                    type: array
                    items:
                      type: object
                      description: >-
                        Set of elements used to provide details on the credit
                        line.
                      required:
                        - Included
                      properties:
                        Included:
                          description: >-
                            Indicates whether or not the credit line is included
                            in the balance of the account.

                            Usage: If not present, credit line is not included
                            in the balance amount of the account.
                          type: boolean
                        Type:
                          description: Limit type, in a coded form.
                          type: string
                          enum:
                            - Available
                            - Credit
                            - Emergency
                            - Pre-Agreed
                            - Temporary
                        Amount:
                          type: object
                          required:
                            - Amount
                            - Currency
                          description: Amount of money of the credit line.
                          properties:
                            Amount:
                              $ref: '#/components/schemas/AmountSimpleType'
                            Currency:
                              $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode_1'
                  LocalAmount:
                    type: object
                    required:
                      - Amount
                      - Currency
                    description: >-
                      Optional component providing the equivalent of Amount in
                      local currency. Default is Local Currency (LCUR) if not
                      specified
                    properties:
                      Amount:
                        $ref: '#/components/schemas/AmountSimpleType'
                      Currency:
                        $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode_1'
                      SubType:
                        description: >-
                          Balance sub type, in a coded form. Default if not specified is LCUR of the account
                        type: string
                        enum:
                          - BCUR
                          - LCUR
                        default: LCUR
              minItems: 1
            TotalValue:
              type: object
              required:
                - Amount
                - Currency
              description: Combined sum of all Amounts in the accounts base currency
              properties:
                Amount:
                  $ref: '#/components/schemas/AmountSimpleType'
                Currency:
                  $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode_1'
        Links:
          $ref: '#/components/schemas/Links'
        Meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
    TransactionsResponseData:
      type: object
      properties:
        Transaction:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
      additionalProperties: false
    TransactionsResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          $ref: '#/components/schemas/TransactionsResponseData'
        Links:
          $ref: '#/components/schemas/Links'
        Meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
    SupplementaryData:
      type: object
      properties: {}
      additionalProperties: true
      description: >-
        Additional information that can not be captured in the structured fields
        and/or any other specific block.
    Transaction:
      type: object
      description: Provides further details on an entry in the report.
      required:
        - AccountId
        - CreditDebitIndicator
        - Status
        - BookingDateTime
        - Amount
      properties:
        AccountId:
          $ref: '#/components/schemas/AccountId'
        TransactionId:
          $ref: '#/components/schemas/TransactionId'
        TransactionReference:
          $ref: '#/components/schemas/TransactionReference'
        StatementReference:
          type: array
          items:
            $ref: '#/components/schemas/StatementReference'
        CreditDebitIndicator:
          $ref: '#/components/schemas/TransactionCreditDebitIndicator'
        Status:
          $ref: '#/components/schemas/ExternalEntryStatus1Code'
        TransactionMutability:
          $ref: '#/components/schemas/TransactionMutability'
        BookingDateTime:
          $ref: '#/components/schemas/BookingDateTime'
        ValueDateTime:
          $ref: '#/components/schemas/ValueDateTime'
        TransactionInformation:
          $ref: '#/components/schemas/TransactionInformation'
        AddressLine:
          $ref: '#/components/schemas/AddressLine'
        Amount:
          $ref: '#/components/schemas/TransactionAmount'
        ChargeAmount:
          $ref: '#/components/schemas/ChargeAmount'
        CurrencyExchange:
          $ref: '#/components/schemas/CurrencyExchange'
        BankTransactionCode:
          $ref: '#/components/schemas/BankTransactionCode'
        ProprietaryBankTransactionCode:
          $ref: '#/components/schemas/ProprietaryBankTransactionCodeStructure1'
        ExtendedProprietaryBankTransactionCodes:
          type: array
          items:
            $ref: '#/components/schemas/ProprietaryBankTransactionCode'
        Balance:
          $ref: '#/components/schemas/TransactionCashBalance'
        MerchantDetails:
          $ref: '#/components/schemas/MerchantDetails'
        CreditorAgent:
          $ref: '#/components/schemas/CreditorAgent'
        CreditorAccount:
          $ref: '#/components/schemas/CreditorAccount'
        DebtorAgent:
          $ref: '#/components/schemas/DebtorAgent'
        DebtorAccount:
          $ref: '#/components/schemas/DebtorAccount'
        CardInstrument:
          $ref: '#/components/schemas/TransactionCardInstrument'
        SupplementaryData:
          $ref: '#/components/schemas/SupplementaryData'
        CategoryPurposeCode:
          $ref: '#/components/schemas/ExternalCategoryPurpose1Code'
        PaymentPurposeCode:
          $ref: '#/components/schemas/PaymentPurposeCode'
        UltimateCreditor:
          $ref: '#/components/schemas/UltimateCreditor'
        UltimateDebtor:
          $ref: '#/components/schemas/UltimateDebtor'
        IntermediaryAgent1:
          $ref: '#/components/schemas/IntermediaryAgent'
        IntermediaryAgent2:
          $ref: '#/components/schemas/IntermediaryAgent'
        IntermediaryAgent3:
          $ref: '#/components/schemas/IntermediaryAgent'
      additionalProperties: false
    TransactionCardInstrument:
      type: object
      required:
        - CardSchemeName
      description: >-
        Set of elements to describe the card instrument used in the transaction.
      properties:
        CardSchemeName:
          description: Name of the card scheme.
          type: string
          enum:
            - AmericanExpress
            - Diners
            - Discover
            - MasterCard
            - VISA
        AuthorisationType:
          description: The card authorisation type.
          type: string
          enum:
            - ConsumerDevice
            - Contactless
            - None
            - PIN
        Name:
          description: Name of the cardholder using the card instrument.
          type: string
          minLength: 1
          maxLength: 70
        Identification:
          description: >-
            Identification assigned by an institution to identify the card
            instrument used in the transaction. This identification is known by
            the account owner, and may be masked.
          type: string
          minLength: 1
          maxLength: 34
      additionalProperties: false
    TransactionCashBalance:
      type: object
      required:
        - CreditDebitIndicator
        - Type
        - Amount
      description: >-
        Set of elements used to define the balance as a numerical representation
        of the net increases and decreases in an account after a transaction
        entry is applied to the account.
      properties:
        CreditDebitIndicator:
          $ref: '#/components/schemas/BalanceCreditDebitIndicator'
        Type:
          $ref: '#/components/schemas/BalanceType'
        Amount:
          type: object
          required:
            - Amount
            - Currency
          description: >-
            Amount of money of the cash balance after a transaction entry is
            applied to the account..
          properties:
            Amount:
              $ref: '#/components/schemas/AmountSimpleType'
            Currency:
              $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode_1'
      additionalProperties: false
    OpeningDate:
      description: >-
        Date on which the account and related basic services are effectively
        operational for the account owner. All dates in the JSON payloads are
        represented in ISO 8601 date-time format. 

        All date-time fields in responses must include the timezone. An example
        is below:

        2017-04-05T10:43:07+00:00
      type: string
      format: date-time
    PostBox:
      description: >-
        Information that locates and identifies a box in a post office assigned
        to a person or organization, where letters for them are kept until
        called for.
      type: string
      example: PO Box 123456
      minLength: 1
      maxLength: 16
    PostCode:
      description: >-
        Identifier consisting of a group of letters and/or numbers that is added
        to a postal address to assist the sorting of mail.
      type: string
      example: 1012 AB
      minLength: 1
      maxLength: 16
    ProprietaryBankTransactionCodeStructure1:
      type: object
      required:
        - Code
      description: Set of elements to fully identify a proprietary bank transaction code.
      properties:
        Code:
          description: >-
            Proprietary bank transaction code to identify the underlying
            transaction.
          type: string
          minLength: 1
          maxLength: 35
        Issuer:
          description: >-
            Identification of the issuer of the proprietary bank transaction
            code.
          type: string
          minLength: 1
          maxLength: 35
      additionalProperties: false
    Room:
      description: >-
        Information that locates and identifies a room to form part of an
        address
      type: string
      example: Basement 03
      minLength: 1
      maxLength: 70
    ProprietaryBankTransactionCode:
      type: object
      description: >-
        Additional proprietary bank transaction codes used by the bank for the
        underlying transaction
      required:
        - Code
      properties:
        Code:
          type: string
          description: >-
            Proprietary bank transaction code to identify the underlying
            transaction.
          minLength: 1
          maxLength: 35
        Issuer:
          type: string
          description: >-
            Identification of the issuer of the proprietary bank transaction
            code.
          minLength: 1
          maxLength: 35
        Description:
          type: string
          description: Description of the code and its usage on the bank's channel
          minLength: 1
          maxLength: 500
    SecondaryIdentification:
      description: >-
        This is secondary identification of the account, as assigned by the
        account servicing institution. 

        This can be used to additionally identify accounts with a roll number
        (in addition to a domestic account identifier combination).
      type: string
      example: '5500008899'
      minLength: 1
      maxLength: 34
    StatementFrequencyAndFormat:
      type: array
      items:
        type: object
        description: Frequency and format of statements for an account
        properties:
          Frequency:
            $ref: '#/components/schemas/Frequency'
          CommunicationMethod:
            $ref: '#/components/schemas/CommunicationMethod'
          Format:
            $ref: '#/components/schemas/FileFormat'
          DeliveryAddress:
            $ref: '#/components/schemas/PostalAddress'
    StatementReference:
      description: >-
        Unique reference for the statement. This reference may be optionally
        populated if available.
      type: string
      example: '002'
      minLength: 1
      maxLength: 35
    StatusUpdateDateTime:
      description: >-
        Date and time at which the resource status was updated. All dates in the
        JSON payloads are represented in ISO 8601 date-time format. 

        All date-time fields in responses must include the timezone. An example
        is below:

        2017-04-05T10:43:07+00:00
      type: string
      format: date-time
    StreetName:
      description: Name of a street or thoroughfare.
      type: string
      example: Bank Street
      minLength: 1
      maxLength: 140
    TownName:
      description: >-
        Name of a built-up area, with defined boundaries, and a local
        government.
      type: string
      example: Amsterdam
      minLength: 1
      maxLength: 140
    TransactionId:
      description: >-
        Unique identifier for the transaction within a servicing institution.
        This identifier is both unique and immutable.
      type: string
      minLength: 1
      maxLength: 210
    TransactionInformation:
      description: |-
        Further details of the transaction. 
        This is the transaction narrative, which is unstructured text.
      type: string
      minLength: 1
      maxLength: 500
    TransactionReference:
      description: >-
        Unique reference for the transaction. This reference is optionally
        populated, and may as an example be the payment identifier assigned by
        the clearing system.
      type: string
      minLength: 1
      maxLength: 210
    UnitNumber:
      description: Number that identifies the unit of a specific address .
      type: string
      example: A88
      minLength: 1
      maxLength: 16
    ValueDateTime:
      description: >-
        Date and time at which assets become available to the account owner in
        case of a credit entry, or cease to be available to the account owner in
        case of a debit transaction entry.

        Usage: If transaction entry status is pending and value date is present,
        then the value date refers to an expected/requested value date.

        For transaction entries subject to availability/float and for which
        availability information is provided, the value date must not be used.
        In this case the availability component identifies the number of
        availability days. All dates in the JSON payloads are represented in ISO
        8601 date-time format. 

        All date-time fields in responses must include the timezone. An example
        is below:

        2017-04-05T10:43:07+00:00
      type: string
      format: date-time
