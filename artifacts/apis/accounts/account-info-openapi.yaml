openapi: 3.0.0
info:
  title: Account Information API
  description: |
    Swagger for the Account Information API.
  contact:
    name: Service Desk
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: "v1.0"
x-wso2-basePath: /open-banking/{version}/account-information
paths:
  /consents/{ConsentId}:
    delete:
      tags:
        - Consents
      summary: Delete a Consent
      description: Enables a client application to inform the bank that the customer has revoked their consent.
      operationId: DeleteConsentsConsentId
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/x-client-id'
      responses:
        '204':
          $ref: '#/components/responses/204ConsentsConsentIdDeleted'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - ClientOAuth2Security: []
  /accounts:
    get:
      tags:
        - Accounts
      summary: Get Accounts
      description: Enables a client application to retrieve a list of a customer's accounts and information about those account(s) that the customer has consented to.
      operationId: GetAccounts
      parameters:
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/x-client-id'
      responses:
        '200':
          $ref: '#/components/responses/200AccountsRead'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - CustomerOAuth2Security: []
  /accounts/{AccountId}:
    get:
      tags:
        - Accounts
      summary: Get an Account by AccountId
      description: Enables a client application to retrieve information about a specific customer account.
      operationId: GetAccountsAccountId
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/x-client-id'
      responses:
        '200':
          $ref: '#/components/responses/200AccountsAccountIdRead'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - CustomerOAuth2Security: []
  /accounts/{AccountId}/balances:
    get:
      tags:
        - Balances
      summary: Get Balances for an AccountId
      description: Enables a client application to retrieve account balance information for a specific customer account.
      operationId: GetAccountsAccountIdBalances
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/x-client-id'
      responses:
        '200':
          $ref: '#/components/responses/200AccountsAccountIdBalancesRead'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - CustomerOAuth2Security: []
  /accounts/{AccountId}/transactions:
    get:
      tags:
        - Transactions
      summary: Get Transactions for an AccountId
      description: Enables a client application to retrieve transaction information for a specific customer account.
      operationId: GetAccountsAccountIdTransactions
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/FromBookingDateTimeParam'
        - $ref: '#/components/parameters/ToBookingDateTimeParam'
        - $ref: '#/components/parameters/x-client-id'
      responses:
        '200':
          $ref: '#/components/responses/200AccountsAccountIdTransactionsRead'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - CustomerOAuth2Security: []
  /balances:
    get:
      tags:
        - Balances
      summary: Get Balances
      description: Enables a client application to retrieve balance information for account(s) that the customer has consented to. 
      operationId: GetBalances
      parameters:
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/x-client-id'
      responses:
        '200':
          $ref: '#/components/responses/200BalancesRead'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - CustomerOAuth2Security: []
  /transactions:
    get:
      tags:
        - Transactions
      summary: Get Transactions
      description: Enables a client application to retrieve transaction information for account(s) that the customer has consented to. 
      operationId: GetTransactions
      parameters:
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/FromBookingDateTimeParam'
        - $ref: '#/components/parameters/ToBookingDateTimeParam'
        - $ref: '#/components/parameters/x-client-id'
      responses:
        '200':
          $ref: '#/components/responses/200TransactionsRead'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - CustomerOAuth2Security: []
components:
  securitySchemes:
    ClientOAuth2Security:
      type: oauth2
      description: >-
        Client credential authorisation flow between the client application and
        the bank
      flows:
        clientCredentials:
          tokenUrl: https://authserver.example/token
          scopes: {}
    CustomerOAuth2Security:
      type: oauth2
      description: >-
        OAuth flow, it is required when the customer needs to perform SCA with
        the bank when a client application wants to access a resource held at
        the bank on behalf of the customer
      flows:
        authorizationCode:
          authorizationUrl: https://authserver.example/authorization
          tokenUrl: https://authserver.example/token
          scopes: {}
  parameters:
    FromBookingDateTimeParam:
      in: query
      name: fromBookingDateTime
      description: |
        The UTC ISO 8601 Date Time to filter transactions FROM.

        Note: Time component is optional - set to 00:00:00 for just Date.

        The value **must not** include the timezone component.
      schema:
        type: string
        format: date-time
        example: '2026-01-01T00:00:00'
    ToBookingDateTimeParam:
      in: query
      name: toBookingDateTime
      description: |
        The UTC ISO 8601 Date Time to filter transactions TO.

        Note: Time component is optional - set to 00:00:00 for just Date.

        The value **must not** include the timezone component.
      schema:
        type: string
        format: date-time
        example: '2026-12-31T23:59:59'
    AccountId:
      name: AccountId
      in: path
      description: AccountId
      required: true
      schema:
        type: string
    ConsentId:
      name: ConsentId
      in: path
      description: ConsentId
      required: true
      schema:
        type: string
    Authorization:
      in: header
      name: Authorization
      required: true
      description: An Authorisation Token as per https://tools.ietf.org/html/rfc6750
      schema:
        type: string
    x-customer-user-agent:
      in: header
      name: x-customer-user-agent
      description: Indicates the user-agent that the customer is using.
      required: false
      schema:
        type: string
    x-fapi-customer-ip-address:
      in: header
      name: x-fapi-customer-ip-address
      required: false
      description: >-
        The customer's IP address if the customer is currently logged in with the
        client application.
      schema:
        type: string
    x-fapi-auth-date:
      in: header
      name: x-fapi-auth-date
      required: false
      description: >-
        The time when the customer last logged in with the client
        application. 

        All dates in the HTTP headers are represented as RFC 7231 Full Dates. An
        example is below: 

        Sun, 10 Sep 2017 19:43:31 UTC
      schema:
        type: string
        pattern: '^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4} \d{2}:\d{2}:\d{2} (GMT|UTC)$'
    x-fapi-interaction-id:
      in: header
      name: x-fapi-interaction-id
      required: false
      description: An RFC4122 UID used as a correlation id.
      schema:
        type: string
    x-client-id:
      in: header
      name: x-client-id
      required: false
      description: |
        Only used if a bank requires the client ID in order to return rate limit headers. 
        
        Client applications __must__ refer to the bank's developer portal for further information on any rate limit policies, if the headers are supported and any additional requirements.

        This header __must not__ be used for client authentication
      schema:
        type: string
  headers:
    RateLimit-Policy:
      required: false
      description: |
        Client applications __must__ refer to the bank's developer portal for further information on any rate limit policies, if the headers are supported and any additional requirements.
        
        A non-empty list of Quota Policy Items. The Item value __MUST__ be a String.
        
        Example:
        `RateLimit-Policy: "default";q=100;w=10`
        
        The **REQUIRED** "q" parameter indicates the quota allocated by this policy measured in quota units.
        
        The **OPTIONAL** "w" parameter value conveys a time window.
      schema:
        type: string
    RateLimit:
      required: false
      description: |
        Client applications __must__ refer to the bank's developer portal for further information on any rate limit policies, if the headers are supported and any additional requirements.
        
        A server uses the "RateLimit" response header field to communicate the current service limit for a quota policy for a particular partition key.
        
        Example:
        `RateLimit: "default";r=50;t=30`
        
        The **REQUIRED** "r" parameter value conveys the remaining quota units for the identified policy.
        
        The **OPTIONAL** "t" parameter value conveys the time window reset time for the identified policy.
      schema:
        type: string
  responses:
    200AccountsRead:
      description: Accounts Read
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/AccountsResponse'
        application/json:
          schema:
            $ref: '#/components/schemas/AccountsResponse'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/AccountsResponse'
    200AccountsAccountIdRead:
      description: Accounts Read
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/AccountsResponse'
        application/json:
          schema:
            $ref: '#/components/schemas/AccountsResponse'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/AccountsResponse'
    200AccountsAccountIdBalancesRead:
      description: Balances Read
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/BalancesResponse'
        application/json:
          schema:
            $ref: '#/components/schemas/BalancesResponse'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/BalancesResponse'
    200BalancesRead:
      description: Balances Read
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/BalancesResponse'
        application/json:
          schema:
            $ref: '#/components/schemas/BalancesResponse'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/BalancesResponse'
    200AccountsAccountIdTransactionsRead:
      description: Transactions Read
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/TransactionsResponse'
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionsResponse'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/TransactionsResponse'
    200TransactionsRead:
      description: Transactions Read
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/TransactionsResponse'
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionsResponse'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/TransactionsResponse'
    204ConsentsConsentIdDeleted:
      description: Consents Deleted
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
    400Error:
      description: Bad request
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Error:
      description: Unauthorized
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
    403Error:
      description: Forbidden
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404Error:
      description: Not found
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
    405Error:
      description: Method Not Allowed
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
    406Error:
      description: Not Acceptable
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
    429Error:
      description: Too Many Requests
      headers:
        Retry-After:
          description: Number in seconds to wait
          schema:
            type: integer
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          schema:
            type: string
    500Error:
      description: Internal Server Error
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/jose+jwe:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    IntermediaryAgent:
      description: "The intermediary agent associated with this transaction."
      type: object
      properties:
        Name:
          description: "Name by which an agent is known and which is usually used to identify that agent."
          type: string
          minLength: 1
          maxLength: 140
        SchemeName:
          $ref: '#/components/schemas/AccountSchemeName'
        Identification:
          description: "Unique and unambiguous identification of a financial institution or a branch of a financial institution."
          type: string
          minLength: 1
          maxLength: 35
        LEI:
          $ref: '#/components/schemas/LEI'
        PostalAddress:
          $ref: '#/components/schemas/PostalAddress'
        ProcessingStatus:
          description: "Status of the payment at the Intermediary Agent."
          type: string
          enum:
            - PDNG
            - RCVD
            - ACSP
            - ACSC
            - RJCT
            - UNKN
            - CANC
    UltimateCreditor:
      description: Ultimate party to which an amount of money is due.
      type: object
      properties:
        Name:
          description: >-
            Name by which a party is known and which is usually used to identify
            that party.
          type: string
          minLength: 1
          maxLength: 140
        Identification:
          description: Identification assigned by an institution.
          type: string
          minLength: 1
          maxLength: 256
        LEI:
          $ref: '#/components/schemas/LEI'
        SchemeName:
          $ref: '#/components/schemas/AccountSchemeName'
        PostalAddress:
          $ref: '#/components/schemas/PostalAddress'
    UltimateDebtor:
      description: Ultimate party that owes an amount of money to the (ultimate) creditor.
      type: object
      properties:
        Name:
          description: >-
            Name by which a party is known and which is usually used to identify
            that party.
          type: string
          minLength: 1
          maxLength: 140
        Identification:
          description: Identification assigned by an institution.
          type: string
          minLength: 1
          maxLength: 256
        LEI:
          $ref: '#/components/schemas/LEI'
        SchemeName:
          $ref: '#/components/schemas/AccountSchemeName'
        PostalAddress:
          $ref: '#/components/schemas/PostalAddress'
    Proxy:
      description: >-
        Specifies an alternate assumed name for the identification of the
        account.
      type: object
      required:
        - Identification
        - Code
      properties:
        Identification:
          description: >-
            Identification used to indicate the account identification under
            another specified name.
          type: string
          example: '2360549017905188'
          minLength: 1
          maxLength: 2048
        Code:
          $ref: '#/components/schemas/ExternalProxyAccountType1Code'
        Type:
          type: string
          description: Type of the proxy identification.
          minLength: 1
          maxLength: 35
    ExternalProxyAccountType1Code:
      description: >-
        Specifies the external proxy account type code, as published in the
        proxy account type external code set.<br /> For more information and a
        full list of values see `ExternalProxyAccountType1Code` in the ISO 20022 external code sets
        [here](https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets)
      type: string
      example: TELE
      enum:
        - TELE
        - EMAL
        - DNAM
        - CINC
        - COTX
        - COID
        - CUST
        - DRLC
        - EIDN
        - EWAL
        - PVTX
        - LEIC
        - MBNO
        - NIDN
        - CCPT
        - SHID
        - SOSE
        - TOKN
        - UBIL
        - VIPN
        - BIID
    AccountId:
      description: >-
        A unique and immutable identifier used to identify the account resource.
        This identifier has no meaning to the account owner.
      type: string
      example: '22289'
      minLength: 1
      maxLength: 40
    ActiveOrHistoricCurrencyCode_0:
      description: >-
        Identification of the currency in which the account is held. 

        Usage: Currency should only be used in case one and the same account
        number covers several currencies

        and the initiating party needs to identify which currency needs to be
        used for settlement on the account.
      type: string
      pattern: '^[A-Z]{3,3}$'
    ActiveOrHistoricCurrencyCode_1:
      description: >-
        A code allocated to a currency by a Maintenance Agency under an
        international identification scheme, as described in the latest edition
        of the international standard ISO 4217 "Codes for the representation of
        currencies and funds".
      type: string
      example: EUR
      pattern: '^[A-Z]{3,3}$'
    AddressLine:
      description: >-
        Information that locates and identifies a specific address for a
        transaction entry, that is presented in free format text.
      type: string
      minLength: 1
      maxLength: 70
    BookingDateTime:
      description: >-
        Date and time when a transaction entry is posted to an account on the
        account servicer's books.

        Usage: Booking date is the expected booking date, unless the status is
        booked, in which case it is the actual booking date. All dates in the
        JSON payloads are represented in ISO 8601 date-time format. 

        All date-time fields in responses must include the timezone. An example
        is below:

        2017-04-05T10:43:07+00:00
      type: string
      format: date-time
    BuildingName:
      description: Name of a referenced building.
      type: string
      minLength: 1
      maxLength: 140
    BuildingNumber:
      description: Number that identifies the position of a building on a street.
      type: string
      example: '11'
      minLength: 1
      maxLength: 16
    CareOf:
      description: >-
        The 'care of' address is used whenever sending mail to a person or
        organisation who does not actually live or work at the address. They
        will receive the mail for the individual.
      type: string
      example: Jane Smith
      minLength: 1
      maxLength: 140
    Description_0:
      description: Specifies the description of the account type.
      type: string
      minLength: 1
      maxLength: 35
    DistrictName:
      description: >-
        Number that of the regional area, known as a district, which forms part
        of an address
      type: string
      example: North Holland
      minLength: 1
      maxLength: 140
    Floor:
      description: Number that identifies the level within a building
      type: string
      example: '11'
      minLength: 1
      maxLength: 70
    ISODateTime:
      description: >-
        All dates in the JSON payloads are represented in ISO 8601 date-time
        format. 

        All date-time fields in responses must include the timezone. An example
        is below:

        2017-04-05T10:43:07+00:00
      type: string
      format: date-time
    Identification_0:
      description: >-
        Identification assigned by an institution to identify an account. This
        identification is known by the account owner.
      type: string
      example: '5500007788'
      minLength: 1
      maxLength: 256
    Identification_1:
      description: Unique and unambiguous identification of the servicing institution.
      type: string
      example: '5500007788'
      minLength: 1
      maxLength: 35
    Identification_2:
      description: >-
        Unique and unambiguous identification of a financial institution or a
        branch of a financial institution.
      type: string
      minLength: 1
      maxLength: 35
    LEI:
      description: >-
        Legal entity identification as an alternate identification for a party.
        Legal Entity Identifier is a code allocated to a party as described in
        ISO 17442 "Financial Services - Legal Entity Identifier (LEI)".
      type: string
      example: IZ9Q00LZEVUKWCQY6X15
      minLength: 1
      maxLength: 20
      pattern: '^[A-Z0-9]{18,18}[0-9]{2,2}$'
    Links:
      type: object
      description: Links relevant to the payload
      properties:
        Self:
          type: string
          format: uri
        First:
          type: string
          format: uri
        Prev:
          type: string
          format: uri
        Next:
          type: string
          format: uri
        Last:
          type: string
          format: uri
      additionalProperties: false
      required:
        - Self
    MaturityDate:
      description: >-
        Maturity date of the account. All dates in the JSON payloads are
        represented in ISO 8601 date-time format. 

        All date-time fields in responses must include the timezone. An example
        is below:

        2017-04-05T10:43:07+00:00
      type: string
      format: date-time
    Meta:
      title: MetaData
      type: object
      description: Meta Data relevant to the payload
      properties:
        TotalPages:
          type: integer
          format: int32
        FirstAvailableDateTime:
          $ref: '#/components/schemas/ISODateTime'
        LastAvailableDateTime:
          $ref: '#/components/schemas/ISODateTime'
      additionalProperties: false
    Name_0:
      description: >-
        The account name is the name or names of the account owner(s)
        represented at an account level, as displayed by the bank's online
        channels.

        Note, the account name is not the product name or the nickname of the
        account.
      type: string
      example: Jane Smith
      minLength: 1
      maxLength: 350
    Name_1:
      description: >-
        Name by which an agent is known and which is usually used to identify
        that agent.
      type: string
      example: Agent Name
      minLength: 1
      maxLength: 140
    Nickname:
      description: >-
        The nickname of the account, assigned by the account owner in order to
        provide an additional means of identification of the account.
      type: string
      minLength: 1
      maxLength: 70
    Account:
      type: object
      description: >-
        Unambiguous identification of the account to which credit and debit
        entries are made. The following fields are optional only for accounts
        that are switched:

          * Data.Currency  
          * Data.AccountCategory  
          * Data.AccountTypeCode

        For all other accounts, the fields must be populated by the bank.
      required:
        - AccountId
      properties:
        AccountId:
          $ref: '#/components/schemas/AccountId'
        Status:
          $ref: '#/components/schemas/AccountStatus'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/StatusUpdateDateTime'
        Currency:
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode_0'
        AccountCategory:
          $ref: '#/components/schemas/AccountType'
        AccountTypeCode:
          $ref: '#/components/schemas/AccountSubType'
        Description:
          $ref: '#/components/schemas/Description_0'
        Nickname:
          $ref: '#/components/schemas/Nickname'
        OpeningDate:
          $ref: '#/components/schemas/OpeningDate'
        MaturityDate:
          $ref: '#/components/schemas/MaturityDate'
        Account:
          type: array
          items:
            type: object
            description: Provides the details to identify an account.
            required:
              - SchemeName
              - Identification
            properties:
              SchemeName:
                $ref: '#/components/schemas/AccountSchemeName'
              Identification:
                $ref: '#/components/schemas/Identification_0'
              Name:
                $ref: '#/components/schemas/Name_0'
              LEI:
                $ref: '#/components/schemas/LEI'
              SecondaryIdentification:
                $ref: '#/components/schemas/SecondaryIdentification'
        StatementFrequencyAndFormat:
          $ref: '#/components/schemas/StatementFrequencyAndFormat'
        Servicer:
          $ref: '#/components/schemas/AccountServicer'
      additionalProperties: false
    AccountStatus:
      description: Specifies the status of account resource in code form.
      type: string
      example: Enabled
      enum:
        - Deleted
        - Disabled
        - Enabled
        - Pending
        - ProForma
    AmountSimpleType:
      description: >-
        A number of monetary units specified in an active currency where the
        unit of currency is explicit and compliant with ISO 4217.
      type: string
      example: '1209.06'
      pattern: '^\d{1,13}$|^\d{1,13}\.\d{1,5}$'
    ChargeAmount:
      type: object
      required:
        - Amount
        - Currency
      description: Transaction charges to be paid by the charge bearer.
      properties:
        Amount:
          $ref: '#/components/schemas/AmountSimpleType'
        Currency:
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode_1'
    TransactionAmount:
      type: object
      required:
        - Amount
        - Currency
      description: Amount of money in the cash transaction entry.
      properties:
        Amount:
          $ref: '#/components/schemas/AmountSimpleType'
        Currency:
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode_1'
    AddressType:
      description: Identifies the nature of the postal address.
      type: string
      example: BIZZ
      enum:
        - BIZZ
        - DLVY
        - MLTO
        - PBOX
        - ADDR
        - HOME
        - CORR
        - STAT
    BalanceType:
      description: >-
        Balance type, in a coded form. <br />
        For a full list of enumeration values refer to `ExternalBalanceType1Code` in the ISO 20022 external code sets [here](https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets).
      type: string
      example: CLAV
      enum:
        - CLAV
        - CLBD
        - FWAV
        - INFO
        - ITAV
        - ITBD
        - OPAV
        - OPBD
        - PRCD
        - XPCD
    BankTransactionCode:
      type: object
      required:
        - Code
        - SubCode
      description: >-
        Set of elements used to fully identify the type of underlying
        transaction resulting in an entry.
      properties:
        Code:
          description: Specifies the family within a domain.
          type: string
        SubCode:
          description: Specifies the sub-product family within a specific family.
          type: string
    AccountServicer:
      type: object
      required:
        - SchemeName
        - Identification
      description: >-
        Party that manages the account on behalf of the account owner, that is
        manages the registration and booking of entries on the account,
        calculates balances on the account and provides information about the
        account.
      properties:
        SchemeName:
          $ref: '#/components/schemas/FinancialInstitutionSchemeName'
        Identification:
          $ref: '#/components/schemas/Identification_1'
        Name:
          $ref: '#/components/schemas/Name_1'
    CreditorAgent:
      type: object
      description: Financial institution servicing an account for the creditor.
      properties:
        SchemeName:
          $ref: '#/components/schemas/FinancialInstitutionSchemeName'
        Identification:
          $ref: '#/components/schemas/Identification_2'
        Name:
          $ref: '#/components/schemas/Name_1'
        LEI:
          $ref: '#/components/schemas/LEI'
        PostalAddress:
          $ref: '#/components/schemas/PostalAddress'
    DebtorAgent:
      type: object
      description: Financial institution servicing an account for the debtor.
      properties:
        SchemeName:
          $ref: '#/components/schemas/FinancialInstitutionSchemeName'
        Identification:
          $ref: '#/components/schemas/Identification_2'
        Name:
          $ref: '#/components/schemas/Name_1'
        LEI:
          $ref: '#/components/schemas/LEI'
        PostalAddress:
          $ref: '#/components/schemas/PostalAddress'
    CreditorAccount:
      type: object
      description: >-
        Unambiguous identification of the account of the creditor, in the case
        of a debit transaction.
      properties:
        SchemeName:
          $ref: '#/components/schemas/AccountSchemeName'
        Identification:
          $ref: '#/components/schemas/Identification_0'
        Name:
          $ref: '#/components/schemas/Name_0'
        SecondaryIdentification:
          $ref: '#/components/schemas/SecondaryIdentification'
        Proxy:
          $ref: '#/components/schemas/Proxy'
    DebtorAccount:
      type: object
      description: >-
        Unambiguous identification of the account of the debtor, in the case of
        a credit transaction.
      properties:
        SchemeName:
          $ref: '#/components/schemas/AccountSchemeName'
        Identification:
          $ref: '#/components/schemas/Identification_0'
        Name:
          $ref: '#/components/schemas/Name_0'
        SecondaryIdentification:
          $ref: '#/components/schemas/SecondaryIdentification'
        Proxy:
          $ref: '#/components/schemas/Proxy'
    ExternalCategoryPurpose1Code:
      description: >-
        Enumeration of codes that outlines the type of purpose behind a
        transaction, payment or risk. 
        For all enum values see `ExternalCategoryPurpose1Code` in the ISO 20022 external code sets [here](https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets)
      type: string
      enum:
        - BONU
        - CASH
        - CBLK
        - CCRD
        - CGWV
        - CIPC
        - CONC
        - CORT
        - DCRD
        - DIVI
        - DVPM
        - EPAY
